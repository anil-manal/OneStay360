name: OneStay360 CI/CD Pipeline

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ─── Cloud Functions Tests ──────────────────────────────────────────────────
  functions-test:
    name: Cloud Functions Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Security audit
        run: npm audit --audit-level moderate || true
        working-directory: functions

      - name: Build TypeScript
        run: npm run build
        working-directory: functions

      - name: Run unit tests
        run: npm test -- --coverage --testPathPattern="test/unit"
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          directory: functions/coverage
          flags: functions

  # ─── Business App Tests ─────────────────────────────────────────────────────
  business-app-test:
    name: Business App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/business

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: apps/business

      - name: Run unit tests
        run: flutter test test/unit --coverage
        working-directory: apps/business

      - name: Run widget tests
        run: flutter test test/widget_test.dart
        working-directory: apps/business

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          directory: apps/business/coverage
          flags: business-app

  # ─── Tenant App Tests ───────────────────────────────────────────────────────
  tenant-app-test:
    name: Tenant App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/tenant

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: apps/tenant

      - name: Run unit tests
        run: flutter test test/unit --coverage
        working-directory: apps/tenant

      - name: Run widget tests
        run: flutter test test/widget_test.dart
        working-directory: apps/tenant

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          directory: apps/tenant/coverage
          flags: tenant-app

  # ─── Shared Packages Tests ──────────────────────────────────────────────────
  packages-test:
    name: Shared Packages Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Test models package
        run: |
          flutter pub get
          flutter test
        working-directory: packages/models

      - name: Test firebase_services package
        run: |
          flutter pub get
          flutter test
        working-directory: packages/firebase_services

  # ─── Admin Web Build Tests ──────────────────────────────────────────────────
  admin-web-test:
    name: Admin Web App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/admin-web

      - name: Build Next.js
        run: npm run build
        working-directory: apps/admin-web

  # ─── Deploy to Staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [functions-test, business-app-test, tenant-app-test, packages-test, admin-web-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to Firebase Staging
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "🚀 Deploying to Firebase Staging..."
            npm install -g firebase-tools
            firebase deploy --project onestay360-1 --only functions,firestore:rules,storage,firestore:indexes,hosting --token "$FIREBASE_TOKEN"
          else
            echo "ℹ️ FIREBASE_TOKEN secret is not configured in repository secrets. Staging validation passed successfully."
          fi

  # ─── Deploy to Production ───────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [functions-test, business-app-test, tenant-app-test, packages-test, admin-web-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to Firebase Production
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "🚀 Deploying to Firebase Production (onestay360-1)..."
            npm install -g firebase-tools
            firebase deploy --project onestay360-1 --only functions,firestore:rules,storage,firestore:indexes,hosting --token "$FIREBASE_TOKEN"
          else
            echo "ℹ️ FIREBASE_TOKEN secret is not configured in repository secrets. All test suites passed successfully! To enable continuous automated deployment, add FIREBASE_TOKEN under Repo Settings -> Secrets."
          fi

      - name: Notify deployment
        if: success()
        run: echo "✅ Pipeline executed successfully"
