<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Status | OneStay360</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #F0FDF4 0%, #FFFFFF 100%);
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      border: 1px solid #E2E8F0;
      padding: 40px 32px;
      text-align: center;
    }
    .icon-container {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #DCFCE7;
      color: #16A34A;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 0 8px #F0FDF4;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 15px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .ref-box {
      background: #F8FAFC;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 28px;
      border: 1px solid #E2E8F0;
      font-size: 13px;
      color: #475569;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ref-val {
      font-family: monospace;
      font-weight: 600;
      color: #1E293B;
      word-break: break-all;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      display: block;
      background: #10B981;
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      transition: background 0.2s ease;
    }
    .btn-primary:hover {
      background: #059669;
    }
    .btn-secondary {
      display: block;
      background: #F1F5F9;
      color: #334155;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 14px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn-secondary:hover {
      background: #E2E8F0;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>Payment Status Received</h1>
    <p class="desc">
      Your transaction has been captured. <strong>OneStay360</strong> is synchronizing your payment confirmation with your booking records.
    </p>

    <div class="ref-box" id="refBox" style="display: none;">
      <span style="color: #94A3B8;">Reference ID:</span>
      <span class="ref-val" id="refId"></span>
    </div>

    <div class="btn-group">
      <a href="onestay360://payment/status" class="btn-primary" id="appLink">
        Return to OneStay360 App
      </a>
      <a href="/" class="btn-secondary">
        Back to Website Home
      </a>
    </div>

    <div class="footer-note">
      Verified by Cashfree &bull; Zero Convenience Fee for Tenants
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const linkId = params.get('link_id') || params.get('order_id') || params.get('cf_id') || '';
      if (linkId) {
        document.getElementById('refId').textContent = linkId;
        document.getElementById('refBox').style.display = 'flex';
        document.getElementById('appLink').href = 'onestay360://payment/status?link_id=' + encodeURIComponent(linkId);
      }
    })();
  </script>
</body>
</html>
